<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Profile</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #263b59, transparent 45%),
        radial-gradient(circle at bottom right, #49341f, transparent 40%),
        #080d18;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 18px;
    color: white;
}

.container {
    width: 1050px;
    max-width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
}

.form-box {
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(212,175,55,0.4);
    backdrop-filter: blur(20px);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.08);
}

.form-header {
    text-align: center;
    margin-bottom: 30px;
}

.form-header .icon {
    font-size: 32px;
    margin-bottom: 10px;
}

.form-header h2 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #f7e7a6, #c49b45, #fff0b5);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.form-header p {
    color: #a9b1c1;
    font-size: 12px;
    margin-top: 7px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 9px;
    margin-bottom: 13px;
}

.form-row input {
    width: 100%;
    min-width: 0;
    padding: 11px 9px;
    border-radius: 9px;
    outline: none;
    font-size: 12px;
    transition: .3s;
}

.form-row input:first-child {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    color: white;
}

.form-row input:last-child {
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.3);
    color: #f5df9b;
    text-align: center;
}

.form-row input::placeholder {
    color: #8993a5;
}

.form-row input:focus {
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212,175,55,0.15);
    background: rgba(255,255,255,0.1);
}

.submit-btn {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(120deg, #a77b24, #f5df9b, #b88a32);
    color: #15100a;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .35s;
}

.submit-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(212,175,55,0.3);
}

.submit-btn:active {
    transform: scale(.98);
}

.result-box {
    padding: 38px 28px;
    border-radius: 25px;
    background: linear-gradient(
        145deg,
        rgba(255,255,255,0.11),
        rgba(255,255,255,0.035)
    );
    border: 1px solid rgba(212,175,55,0.45);
    backdrop-filter: blur(20px);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.08);
    min-height: 480px;
}

.result-header {
    text-align: center;
    margin-bottom: 35px;
}

.result-header .crown {
    font-size: 35px;
    margin-bottom: 8px;
}

.result-header h2 {
    color: #f1d68d;
    font-size: 24px;
}

.result-header p {
    color: #9da8b8;
    font-size: 12px;
    margin-top: 6px;
}

.result-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 15px 12px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
    border-left: 3px solid #c49b45;
    border-radius: 10px;
    font-size: 13px;
    animation: appear .5s ease both;
}

.result-item strong {
    color: #e7ca83;
    flex-shrink: 0;
}

.result-item span {
    text-align: right;
    overflow-wrap: anywhere;
}

.empty-message {
    text-align: center;
    color: #a5afbd;
    margin-top: 80px;
    line-height: 2;
    font-size: 14px;
}

#message {
    text-align: center;
    color: #d9bd70;
    font-size: 12px;
    margin-top: 15px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 750px) {
    .container {
        grid-template-columns: 1fr;
    }

    .form-box,
    .result-box {
        padding: 25px 18px;
    }
}

@media(max-width: 360px) {
    .form-row {
        grid-template-columns: 1fr 85px;
    }
}
</style>
</head>

<body>

    <div></div>


<div class="container">

    <form class="form-box" id="myForm" novalidate>

        <div class="form-header">
            <div class="icon">✦</div>
            <h2>PERSONAL PROFILE</h2>
            <p>Enter Your Information Below</p>
        </div>

        <div class="form-row">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="nameColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="lastName" placeholder="Last Name">
            <input type="text" id="lastColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="emailColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="country" placeholder="Country">
            <input type="text" id="countryColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="number" id="age" placeholder="Age">
            <input type="text" id="ageColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="education" placeholder="Education">
            <input type="text" id="educationColor" placeholder="Color">
        </div>

        <div class="form-row">
            <input type="text" id="job" placeholder="Job">
            <input type="text" id="jobColor" placeholder="Color">
        </div>

        <button type="submit" class="submit-btn">
            ✦ SUBMIT ✦
        </button>

        <p id="message"></p>

    </form>

    <div class="result-box">

        <div class="result-header">
            <div class="crown">♛</div>
            <h2>MY PROFILE</h2>
            <p>YOUR PERSONAL INFORMATION</p>
        </div>

        <div id="result">
            <div class="empty-message">
                ✧<br><br>
                Your information will appear here.<br>
                Complete the form and click Submit.
            </div>
        </div>

    </div>

</div>

<script>
const form = document.getElementById("myForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const fields = [
        {
            label: "Name",
            value: document.getElementById("name").value,
            color: document.getElementById("nameColor").value
        },
        {
            label: "Last Name",
            value: document.getElementById("lastName").value,
            color: document.getElementById("lastColor").value
        },
        {
            label: "Email",
            value: document.getElementById("email").value,
            color: document.getElementById("emailColor").value
        },
        {
            label: "Country",
            value: document.getElementById("country").value,
            color: document.getElementById("countryColor").value
        },
        {
            label: "Age",
            value: document.getElementById("age").value,
            color: document.getElementById("ageColor").value
        },
        {
            label: "Education",
            value: document.getElementById("education").value,
            color: document.getElementById("educationColor").value
        },
        {
            label: "Job",
            value: document.getElementById("job").value,
            color: document.getElementById("jobColor").value
        }
    ];

    let output = "";

    fields.forEach(function(item, index) {
        if (item.value.trim() !== "") {
            let color = item.color.trim();

            if (!CSS.supports("color", color)) {
                color = "#ffffff";
            }

            output += `
                <div class="result-item" style="animation-delay:${index * 0.08}s">
                    <strong>${escapeHTML(item.label)}</strong>
                    <span style="color:${color}">
                        ${escapeHTML(item.value)}
                    </span>
                </div>
            `;
        }
    });

    document.getElementById("result").innerHTML =
        output || `
            <div class="empty-message">
                Please enter your information!
            </div>
        `;

    document.getElementById("message").textContent =
        "✦ Profile Updated Successfully ✦";
});

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}
</script>
 
</body>
</html>
